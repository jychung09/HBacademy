<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBacademy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        nav {
            background-color: #34495e;
            padding: 10px 0;
        }
        
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        
        nav a:hover {
            color: #3498db;
        }
        
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        section {
            margin-bottom: 40px;
        }
        
        section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>HBacademy</h1>
        <p>환영합니다!</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="#home">홈</a></li>
            <li><a href="#about">소개</a></li>
            <li><a href="#courses">강좌</a></li>
            <li><a href="#contact">연락</a></li>
        </ul>
    </nav>
    
    <main>
        <section id="home">
            <h2>홈</h2>
            <p>HBacademy에 오신 것을 환영합니다. 여기서 최고의 교육을 받을 수 있습니다.</p>
        </section>
        
        <section id="about">
            <h2>소개</h2>
            <p>HBacademy는 학생들에게 질 높은 교육을 제공하는 온라인 학습 플랫폼입니다.</p>
        </section>
        
        <section id="courses">
            <h2>강좌</h2>
            <p>다양한 주제의 강좌를 제공하고 있습니다.</p>
        </section>
        
        <section id="contact">
            <h2>연락처</h2>
            <p>문의사항이 있으신 경우 연락주시기 바랍니다.</p>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2026 HBacademy. All rights reserved.</p>
    </footer>
</body>
</html>
